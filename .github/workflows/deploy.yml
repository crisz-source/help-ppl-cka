name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# um deploy por vez; não cancela um que já está publicando
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # --strict: link quebrado ou página fora do nav falha o build em vez de publicar errado
      - run: mkdocs build --strict
      # layout 2 (Astro/Starlight em v2/): mesmo conteúdo de docs/, publicado em /v2/
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
        working-directory: v2
      - run: npm run build
        working-directory: v2
      - run: cp -r v2/dist site/v2
      # repo privado no plano Free não tem Pages: só valida o build, sem publicar
      - if: ${{ !github.event.repository.private }}
        uses: actions/configure-pages@v6
      - if: ${{ !github.event.repository.private }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
