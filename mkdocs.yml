site_name: Estudo CKA em público
site_description: Preparação para a certificação CKA (Certified Kubernetes Administrator), em português do Brasil.
site_url: https://crisz-source.github.io/help-ppl-cka/
repo_url: https://github.com/crisz-source/help-ppl-cka
repo_name: crisz-source/help-ppl-cka

theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Modo claro

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details          # habilita os blocos recolhíveis "??? success"
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:          # habilita diagramas ```mermaid
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Início: index.md
  - Trilhas:
      - Começar do zero: trilhas/iniciante.md
      - Fundamentos: trilhas/fundamentos.md
      - Revisão rápida: trilhas/revisao-rapida.md
      - Comandos de memória: trilhas/comandos-de-memoria.md
      - Treinar troubleshooting:
          - trilhas/troubleshooting/index.md
          - Pod não inicia: trilhas/troubleshooting/pod-nao-inicia.md
          - Aplicação não responde: trilhas/troubleshooting/aplicacao-nao-responde.md
          - Agendamento: trilhas/troubleshooting/agendamento.md
          - Armazenamento: trilhas/troubleshooting/armazenamento.md
          - Nó NotReady: trilhas/troubleshooting/no-notready.md
          - Control plane: trilhas/troubleshooting/control-plane.md
  - "1. Cluster Architecture, Installation & Configuration (25%)":
      - 01-cluster-architecture/index.md
      - RBAC: 01-cluster-architecture/rbac.md
      - Upgrade com kubeadm: 01-cluster-architecture/upgrade-kubeadm.md
      - Adicionar um nó com kubeadm join: 01-cluster-architecture/kubeadm-join.md
      - Certificados com kubeadm: 01-cluster-architecture/kubeadm-certs.md
      - Drain, cordon e uncordon: 01-cluster-architecture/drain-cordon-uncordon.md
      - Backup e restore do etcd: 01-cluster-architecture/etcd-backup-restore.md
      - Helm e Kustomize: 01-cluster-architecture/helm-kustomize.md
  - "2. Workloads & Scheduling (15%)":
      - 02-workloads-scheduling/index.md
      - "Deployments: rollout, rollback e scale": 02-workloads-scheduling/deployments-rollout.md
      - ConfigMap e Secret: 02-workloads-scheduling/configmap-secret.md
      - Requests, limits e QoS: 02-workloads-scheduling/requests-limits-qos.md
      - ResourceQuota: 02-workloads-scheduling/resourcequota.md
      - Taints, tolerations e nodeSelector: 02-workloads-scheduling/taints-tolerations-nodeselector.md
      - Affinity e anti-affinity: 02-workloads-scheduling/affinity.md
      - DaemonSet, Job, CronJob e StatefulSet: 02-workloads-scheduling/daemonset-job-cronjob-statefulset.md
      - HPA: 02-workloads-scheduling/hpa.md
  - "3. Services & Networking (20%)":
      - 03-services-networking/index.md
      - Services e Endpoints: 03-services-networking/services-endpoints.md
      - DNS do cluster: 03-services-networking/dns.md
      - NetworkPolicy: 03-services-networking/network-policy.md
      - Ingress: 03-services-networking/ingress.md
      - Gateway API: 03-services-networking/gateway-api.md
  - "4. Storage (10%)":
      - 04-storage/index.md
      - "Volumes em Pods: emptyDir e hostPath": 04-storage/volumes-emptydir-hostpath.md
      - "PV e PVC: binding e accessModes": 04-storage/pv-pvc.md
      - StorageClass e provisionamento dinâmico: 04-storage/storageclass.md
      - "reclaimPolicy: Retain × Delete": 04-storage/reclaim-policy.md
      - Expansão de PVC: 04-storage/expansao-pvc.md
  - "5. Troubleshooting (30%)":
      - 05-troubleshooting/index.md
      - Logs e eventos: 05-troubleshooting/logs-eventos.md
      - "Pods: Pending, CrashLoopBackOff, ImagePullBackOff": 05-troubleshooting/pods.md
      - Nó NotReady: 05-troubleshooting/no-notready.md
      - Control plane fora: 05-troubleshooting/control-plane.md
